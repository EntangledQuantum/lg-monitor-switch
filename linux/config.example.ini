# lg-monitor configuration: ~/.config/lg-monitor/config.ini
# Every key is optional; the values below are the defaults.
# The settings app (lg-monitor-settings) edits this file for you.

[general]
# Start the enabled background services (LAN listener, Deskflow watcher)
# automatically at login (systemd --user units). The top bar menu is a GNOME
# Shell extension and is always loaded once enabled.
autostart = true

[monitor]
# "auto" = find the monitor with `ddcutil detect --brief` (cached per login),
# or a fixed I2C bus number, e.g. 6 for /dev/i2c-6.
bus = auto
# Monitor matching for auto-detection: EDID manufacturer id + model substring.
mfg = GSM
model = LG ULTRAGEAR
# The input THIS Linux computer is plugged into: dp1, dp2, hdmi1 or hdmi2.
home_input = dp1
# Where the "Switch" button sends the monitor (the other computer).
switch_target = hdmi2
# Shown on the button: "Switch to <name>".
switch_target_name = Windows

[listener]
# Opt-in: `lg-monitor service listener on` or the settings app.
enabled = false
# Address/port of the optional LAN listener (lg-monitor-listener.service).
bind = 0.0.0.0
port = 47320
# "private" = only accept private/link-local/loopback client addresses.
# "any"     = accept any address (the token is still required).
allow = private

[deskflow]
# Opt-in: `lg-monitor service deskflow on` or the settings app.
enabled = false
# Seconds to wait after the cursor moves to another computer.
delay = 5
# Minimum seconds between two automatic switches.
cooldown = 2
# "auto" = use Deskflow's "Log to file" path, or an explicit path.
log_file = auto
# "auto" (log file if found, else the user journal), "file" or "journal".
source = auto

[deskflow.screens]
# Deskflow screen name = input to show when the cursor is on that screen.
# Use "none" to do nothing. Names are case-sensitive.
# my-linux-pc = dp1
# my-windows-pc = hdmi2
